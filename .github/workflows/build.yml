name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Если в процессе сборки будут вызываться go build / go install,
  # Go будет таргетировать уровень инструкций x86-64-v2.
  # Это аналог -march=x86-64-v2 для Go.
  GOAMD64: v2

jobs:
  build:
    name: Build (${{ matrix.os }}, Qt ${{ matrix.qt_version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_version: '5.15.2'
            qt_arch: gcc_64
            qt_modules: ''

          - os: macos-latest
            qt_version: '5.15.2'
            qt_arch: clang_64
            qt_modules: ''

          - os: windows-latest
            qt_version: '5.15.2'
            qt_arch: win64_msvc2019_64
            qt_modules: ''

          - os: ubuntu-latest
            qt_version: '6.8.3'
            qt_arch: linux_gcc_64
            qt_modules: qt5compat

          - os: macos-latest
            qt_version: '6.8.3'
            qt_arch: clang_64
            qt_modules: qt5compat

          - os: windows-latest
            qt_version: '6.8.3'
            qt_arch: win64_msvc2022_64
            qt_modules: qt5compat

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache: false

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: linux
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          install-deps: true
          cache: true

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true

      - name: Remove obsolete AGL dependency (Qt 6 macOS)
        if: runner.os == 'macOS' && startsWith(matrix.qt_version, '6.')
        shell: bash
        run: |
          qt_prefix="$(qmake -query QT_INSTALL_PREFIX)"
          find "$qt_prefix" -type f \( -name '*.conf' -o -name '*.prf' -o -name '*.prl' \) \
            -exec perl -pi -e 's/-framework AGL//g' {} +

          if find "$qt_prefix" -type f \( -name '*.conf' -o -name '*.prf' -o -name '*.prl' \) \
              -exec grep -l -- '-framework AGL' {} + | grep -q .; then
            echo 'Failed to remove the obsolete AGL framework dependency.' >&2
            exit 1
          fi

      - name: Set up MSVC 2019
        if: runner.os == 'Windows' && startsWith(matrix.qt_version, '5.')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29

      - name: Set up MSVC 2022
        if: runner.os == 'Windows' && startsWith(matrix.qt_version, '6.')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p build-ci
          cd build-ci

          march_flag=""
          if [[ "$(uname -m)" == "x86_64" ]]; then
            march_flag="-march=x86-64-v2"
          fi

          qmake ../liteidex CONFIG+=release \
            "QMAKE_CXXFLAGS_RELEASE+=-O3 ${march_flag} -flto=thin -ffat-lto-objects" \
            "QMAKE_LFLAGS_RELEASE+=-flto=thin"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build-ci
          cd build-ci

          qmake_args=(
            CONFIG+=release
            'QMAKE_LIBS_OPENGL=-framework OpenGL'
          )

          if [[ '${{ matrix.qt_version }}' == 6.* ]]; then
            qmake_args+=('QMAKE_CXXFLAGS+=-include arm_acle.h')
          fi

          march_flag=""
          if [[ "$(uname -m)" == "x86_64" ]]; then
            march_flag="-march=x86-64-v2"
          fi

          qmake_args+=(
            "QMAKE_CXXFLAGS_RELEASE+=-O3 ${march_flag} -flto=thin"
            "QMAKE_LFLAGS_RELEASE+=-flto=thin"
          )

          qmake ../liteidex "${qmake_args[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist build-ci mkdir build-ci
          cd build-ci

          qmake ..\liteidex CONFIG+=release CONFIG-=precompile_header ^
            "QMAKE_CXXFLAGS_RELEASE+=/O2 /GL /Gy /Oi /Ot /Ob2 /favor:blend /arch:SSE4.2" ^
            "QMAKE_LFLAGS_RELEASE+=/LTCG /OPT:REF /OPT:ICF"

      - name: Compile (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          make -C build-ci -j"$JOBS"

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          nmake /NOLOGO /f build-ci\Makefile
